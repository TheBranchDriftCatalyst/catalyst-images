# https://taskfile.dev
version: '3'

vars:
  VERSION:
    sh: cat VERSION 2>/dev/null || echo "0.1.0"
  REGISTRY: ghcr.io/thebranchdriftcatalyst
  IMAGE_NAME: catalyst-images
  VARIANTS: minimal base k8s python node go full hacker

env:
  NIX_CONFIG: experimental-features = nix-command flakes

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  # ==========================================================================
  # Setup & Dependencies
  # ==========================================================================

  setup:
    desc: Install all dependencies and setup development environment
    cmds:
      - task: deps
      - task: hooks

  deps:
    desc: Install all dependencies
    deps: [deps:nix, deps:tools]

  deps:nix:
    desc: Install/update Nix and run flake check
    # Maybe we make this use our ./scripts/install-nix.sh later????
    cmds:
      - |
        if ! command -v nix &> /dev/null; then
          echo "Installing Nix..."
          curl -L https://nixos.org/nix/install | sh -s -- --daemon
        fi
      - nix flake check ./nix || true
    status:
      - command -v nix

  deps:tools:
    desc: Install required CLI tools
    cmds:
      - |
        echo "Checking required tools..."
        command -v docker >/dev/null || echo "WARNING: docker not found"
        command -v tilt >/dev/null || echo "WARNING: tilt not found (brew install tilt)"
        command -v lefthook >/dev/null || echo "WARNING: lefthook not found (brew install lefthook)"
        echo "Done."

  hooks:
    desc: Install git hooks via lefthook
    cmds:
      - lefthook install
    status:
      - test -f .git/hooks/pre-commit

  # ==========================================================================
  # Building
  # ==========================================================================

  build:
    desc: Build all Docker image variants
    cmds:
      - for: { var: VARIANTS, split: ' ' }
        task: build:variant
        vars:
          VARIANT: '{{.ITEM}}'

  build:variant:
    desc: Build a specific variant (VARIANT=base)
    vars:
      VARIANT: '{{.VARIANT | default "base"}}'
    dir: nix
    cmds:
      - echo "Building {{.IMAGE_NAME}}:{{.VARIANT}} (v{{.VERSION}})..."
      - nix build ".#docker-{{.VARIANT}}" --out-link "result-{{.VARIANT}}"
      - ./result-{{.VARIANT}} | docker load
      - docker tag {{.IMAGE_NAME}}:{{.VARIANT}} {{.IMAGE_NAME}}:{{.VARIANT}}-{{.VERSION}}
      - echo "Tagged {{.IMAGE_NAME}}:{{.VARIANT}}-{{.VERSION}}"

  build:base:
    desc: Build base variant
    cmds:
      - task: build:variant
        vars: { VARIANT: base }

  build:full:
    desc: Build full variant
    cmds:
      - task: build:variant
        vars: { VARIANT: full }

  # ==========================================================================
  # Multi-Architecture Builds
  # ==========================================================================

  build:multiarch:
    desc: Build multi-arch images (amd64 + arm64)
    vars:
      VARIANT: '{{.VARIANT | default "base"}}'
    cmds:
      - echo "Multi-arch build for {{.VARIANT}}..."
      - |
        # Build for current arch first
        task build:variant VARIANT={{.VARIANT}}

        # Tag with arch suffix
        ARCH=$(uname -m | sed 's/x86_64/amd64/' | sed 's/aarch64/arm64/')
        docker tag {{.IMAGE_NAME}}:{{.VARIANT}} {{.IMAGE_NAME}}:{{.VARIANT}}-{{.VERSION}}-$ARCH
        echo "Tagged {{.IMAGE_NAME}}:{{.VARIANT}}-{{.VERSION}}-$ARCH"

  # ==========================================================================
  # Development
  # ==========================================================================

  dev:
    desc: Start Tilt development environment
    cmds:
      - tilt up

  dev:down:
    desc: Stop Tilt development environment
    cmds:
      - tilt down

  shell:
    desc: Run interactive shell in container (VARIANT=base)
    vars:
      VARIANT: '{{.VARIANT | default "base"}}'
    cmds:
      - docker run --rm -it -v $(pwd):/workspace {{.IMAGE_NAME}}:{{.VARIANT}}

  shell:debug:
    desc: Run interactive shell with debug mode enabled
    vars:
      VARIANT: '{{.VARIANT | default "base"}}'
    cmds:
      - docker run --rm -it -e CATALYST_DEBUG=1 -p 9229:9229 -v $(pwd):/workspace {{.IMAGE_NAME}}:{{.VARIANT}}

  # ==========================================================================
  # Testing & Linting
  # ==========================================================================

  lint:
    desc: Run all linters
    deps: [lint:nix, lint:shell]

  lint:nix:
    desc: Lint Nix files
    cmds:
      - nix flake check ./nix

  lint:shell:
    desc: Lint shell scripts
    cmds:
      - |
        if command -v shellcheck &> /dev/null; then
          find . -name "*.sh" -type f | xargs shellcheck || true
        else
          echo "shellcheck not installed, skipping"
        fi

  test:
    desc: Run tests
    cmds:
      - task: test:image

  test:image:
    desc: Test that built images work correctly
    vars:
      VARIANT: '{{.VARIANT | default "base"}}'
    cmds:
      - echo "Testing {{.IMAGE_NAME}}:{{.VARIANT}}..."
      - docker run --rm {{.IMAGE_NAME}}:{{.VARIANT}} /bin/zsh -c 'zsh --version && starship --version && echo "OK"'
      - echo "Tests passed!"

  # ==========================================================================
  # Releasing (uses scripts/ for complex logic)
  # ==========================================================================

  release:
    desc: "Full release: changelog → build → push → git (VERSION=x.y.z)"
    cmds:
      - ./scripts/release.sh {{.CLI_ARGS}}

  release:build-only:
    desc: "Release with build only, no push (VERSION=x.y.z)"
    cmds:
      - ./scripts/release.sh {{.CLI_ARGS}} --skip-push

  release:git-only:
    desc: "Git release only, skip build/push (VERSION=x.y.z)"
    cmds:
      - ./scripts/release.sh {{.CLI_ARGS}} --skip-build

  release:version:
    desc: Bump version in VERSION file
    cmds:
      - ./scripts/release-version.sh {{.CLI_ARGS}}

  release:changelog:
    desc: Update CHANGELOG.md with new version
    cmds:
      - ./scripts/release-changelog.sh {{.CLI_ARGS}}

  publish:
    desc: Push all variants to container registry
    cmds:
      - ./scripts/release-push.sh

  publish:variant:
    desc: Push specific variant to registry
    cmds:
      - ./scripts/release-push.sh {{.CLI_ARGS}}

  # ==========================================================================
  # Cleanup
  # ==========================================================================

  clean:
    desc: Clean build artifacts and caches
    cmds:
      - task: clean:nix
      - task: clean:docker

  clean:nix:
    desc: Clean Nix build results
    dir: nix
    cmds:
      - rm -f result-*
      - echo "Cleaned Nix results"

  clean:docker:
    desc: Clean Docker build cache
    cmds:
      - docker builder prune -f
      - docker image prune -f
      - echo "Cleaned Docker cache"

  clean:all:
    desc: Deep clean including Nix garbage collection
    cmds:
      - task: clean
      - nix-collect-garbage -d
      - docker system prune -af
      - echo "Deep clean complete"

  # ─── GPU image + shim (gpu/, Dockerfile-native — NOT the nix tree) ───────────
  gpu:shim:install:
    desc: Install the comfyui-shim launchd service (OpenAI /v1/images on :8012)
    cmds:
    - |
      set -euo pipefail
      SHIM_HOME="{{.TASKFILE_DIR}}/gpu/shim"
      VENV="$SHIM_HOME/.venv"
      MODELS_YAML="{{.TASKFILE_DIR}}/gpu/comfyui/models.yaml"
      # The weight tree is NOT in this repo. It is a git submodule working dir in
      # mac-sdlc-node holding ~228GB; only the server moved here. Override with
      # MODEL_ROOT=... task gpu:shim:install if your checkout sits elsewhere.
      MODEL_ROOT="${MODEL_ROOT:-$(cd "{{.TASKFILE_DIR}}/.." && pwd)/mac-sdlc-node/services/ComfyUI/models}"

      [ -d "$VENV" ] || { echo "::ERROR:: $VENV missing — run: cd $SHIM_HOME && uv venv .venv && uv pip install --python .venv/bin/python -e ." >&2; exit 1; }
      [ -s "$MODELS_YAML" ] || { echo "::ERROR:: $MODELS_YAML missing" >&2; exit 1; }
      [ -d "$MODEL_ROOT" ] || { echo "::ERROR:: MODEL_ROOT does not exist: $MODEL_ROOT" >&2; exit 1; }

      PLIST_SRC="$SHIM_HOME/launchd/com.comfyui-shim.plist"
      PLIST_DST="$HOME/Library/LaunchAgents/com.comfyui-shim.plist"
      sed -e "s|__SHIM_HOME__|$SHIM_HOME|g" \
          -e "s|__VENV__|$VENV|g" \
          -e "s|__MODEL_ROOT__|$MODEL_ROOT|g" \
          -e "s|__MODELS_YAML__|$MODELS_YAML|g" \
          "$PLIST_SRC" > "$PLIST_DST"
      # Assert every placeholder was substituted. A missed one yields a literal
      # __MODEL_ROOT__ path, and config.py would then raise on a path that merely
      # looks wrong rather than telling you the template drifted.
      if grep -qE '__[A-Z_]+__' "$PLIST_DST"; then
        echo "::ERROR:: unsubstituted placeholders remain:" >&2
        grep -oE '__[A-Z_]+__' "$PLIST_DST" | sort -u >&2
        exit 1
      fi
      plutil -lint "$PLIST_DST"
      # bootout is ASYNC — bootstrap immediately after races it and fails with
      # "Bootstrap failed: 5: Input/output error". Wait for the service to leave
      # the domain before re-registering. Measured exactly that on 2026-10-05.
      launchctl bootout "gui/$(id -u)/com.comfyui-shim" 2>/dev/null || true
      for _ in $(seq 1 20); do
        launchctl print "gui/$(id -u)/com.comfyui-shim" >/dev/null 2>&1 || break
        sleep 0.5
      done
      launchctl bootstrap "gui/$(id -u)" "$PLIST_DST"
      launchctl kickstart "gui/$(id -u)/com.comfyui-shim"
      echo "installed comfyui-shim → $PLIST_DST"

  gpu:shim:uninstall:
    desc: Bootout and remove the comfyui-shim launchd service
    cmds:
    - launchctl bootout "gui/$(id -u)/com.comfyui-shim" 2>/dev/null || true
    - rm -f "$HOME/Library/LaunchAgents/com.comfyui-shim.plist"
    - echo "removed comfyui-shim"

  gpu:shim:status:
    desc: Is the shim loaded, and which tree is it serving from?
    cmds:
    - |
      launchctl list | grep -E 'comfyui-shim' || echo "(shim not loaded)"
      PID=$(launchctl list 2>/dev/null | awk '$3=="com.comfyui-shim"{print $1}')
      [ -n "$PID" ] && ps -o pid=,command= -p "$PID" | cut -c1-160 || true

  gpu:shim:health:
    desc: Check the shim health endpoint and model count
    cmds:
    - curl -fsS localhost:8012/healthz | head -c 400; echo
    - |
      curl -fsS localhost:8012/v1/models \
        | python3 -c "import json,sys; d=json.load(sys.stdin); print('models:', len(d.get(\"data\",[])))"

  gpu:shim:dev:
    desc: Run the shim in the foreground against the local ComfyUI
    dir: gpu/shim
    cmds:
    - |
      MODEL_ROOT="${MODEL_ROOT:-$(cd ../.. && pwd)/../mac-sdlc-node/services/ComfyUI/models}" \
      MODELS_YAML="${MODELS_YAML:-$(cd .. && pwd)/comfyui/models.yaml}" \
        uv run comfyui-shim
