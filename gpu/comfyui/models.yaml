    # ── Qwen-Image-2.1 (Sept 2026) ───────────────────────────────────
    # UNBLOCKED 2026-09-24 by bumping services/ComfyUI from v0.24.0 to
    # v0.37.2. The old pin could not load this: its QwenImage.clip_target
    # hardcoded the qwen25_7b encoder. v0.37.2 adds `class QwenImage21`
    # (supported_models.py) plus comfy/text_encoders/qwen_image21.py,
    # and dispatches on the ENCODER — in comfy/sd.py,
    # `clip_type == CLIPType.QWEN_IMAGE and te_model == QWEN3VL_8B` picks
    # the 2.1 tokenizer. So v1 and 2.1 coexist: same CLIPLoader
    # `type: qwen_image`, different encoder file decides which you get.
    #
    # bf16 throughout, deliberately. The official template ships
    # int8_convrot for both the DiT and the encoder, but convrot/nvfp4 are
    # NVIDIA-oriented numeric formats — bf16 is the Apple-Silicon path.
    # Costs ~32GB all-in against ~17GB for the int8 route.
    - name: qwen-image-2.1-bf16
      hf_repo: "Comfy-Org/Qwen-Image-2.1"
      hf_file: "diffusion_models/qwen_image_2.1_bf16.safetensors"
      dest: unet
      size_gb: 14.23
      license: other
      used_by: [qwen-image-2.1]
      tags: [qwen, bf16, sota, multilingual]

    # Qwen3-VL-8B. This file is what makes ComfyUI resolve the 2.1
    # architecture rather than v1 — do not swap it for the v1
    # qwen_2.5_vl_7b encoder.
    - name: qwen3vl-8b-encoder
      hf_repo: "Comfy-Org/Qwen-Image-2.1"
      hf_file: "text_encoders/qwen3vl_8b_bf16.safetensors"
      dest: clip
      size_gb: 17.53
      license: other
      used_by: [qwen-image-2.1]
      tags: [qwen, encoder, qwen3vl]

    - name: qwen-image-2.1-vae
      hf_repo: "Comfy-Org/Qwen-Image-2.1"
      hf_file: "vae/qwen_image_2.1_vae_bf16.safetensors"
      dest: vae
      size_gb: 0.676
      license: other
      used_by: [qwen-image-2.1]
      tags: [qwen, vae]

