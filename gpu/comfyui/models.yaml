    # ── LoRAs (community fine-tune patches, swap-in/out at runtime) ─
    # Community LoRAs land in ComfyUI/models/loras/. They're tiny
    # (~40–220 MB) compared to a full checkpoint and stack additively
    # at render time. Optional friendly fields per entry:
    #   friendly_name        short human label for the UI
    #   when_to_use          1-line "use this when…" hint
    #   recommended_strength sane default for the strength slider
    #   trigger_words        prompt tokens that activate the LoRA's training
    #   compatible_with      list of pipeline names this is known to work on
    # The shim exposes filenames via /v1/loras; the operator UI joins on
    # `hf_file` (which becomes the on-disk filename) to surface the
    # friendly metadata.
    - name: anime-detailer-xl-lora
      friendly_name: "Anime Detailer XL"
      when_to_use: "Sharpens line work, eyes, and texture detail on anime/illustration outputs. Almost always-on for SDXL anime stacks."
      recommended_strength: 1.0
      compatible_with: [sdxl-illustrious-xl, sdxl-wai-nsfw-illustrious, sdxl-pony-v6]
      hf_repo: "Linaqruf/anime-detailer-xl-lora"
      hf_file: "anime-detailer-xl.safetensors"
      dest: loras
      size_gb: 0.041
      license: openrail++
      used_by: [sdxl-illustrious-lora-demo]
      tags: [sdxl, lora, detail, anime]

    - name: midsommar-cartoon-lora
      friendly_name: "Midsommar Cartoon"
      when_to_use: "Painterly cartoon style with thick outlines + saturated colour palette. Apply 0.6–0.9 to retain control."
      recommended_strength: 0.8
      trigger_words: ["midsommar cartoon"]
      compatible_with: [sdxl-illustrious-xl, sdxl-wai-nsfw-illustrious, sdxl-pony-v6, sdxl-juggernaut-xl-v9]
      hf_repo: "alvdansen/midsommarcartoon"
      hf_file: "araminta_k_midsommar_cartoon.safetensors"
      dest: loras
      size_gb: 0.218
      license: openrail++
      used_by: [sdxl-illustrious-lora-demo]
      tags: [sdxl, lora, style, cartoon]

    # ── WAI NSFW Illustrious v14 (SDXL Illustrious fine-tune) ────
    # nyanntama's mirror is the only HF mirror with the full v14
    # single-file safetensors; John6666's mirror is diffusers-shards
    # which ComfyUI's CheckpointLoaderSimple can't consume.
    - name: wai-nsfw-illustrious-v14
      hf_repo: "nyanntama/WAI-NSFW-illustrious-SDXL"
      hf_file: "waiNSFWIllustrious_v140.safetensors"
      dest: checkpoints
      size_gb: 6.5
      license: fair-ai-public
      used_by: [sdxl-wai-nsfw-illustrious]
      tags: [sdxl, illustrious, anime, uncensored]

    # ══ September 2026 refresh ═══════════════════════════════════════
    # Audited 2026-09-24. Both items that used to sit in the "future /
    # not yet wired" note below are now wired — their blockers were
    # stale:
    #   - Z-Image-Turbo did NOT need the raysers/Mflux-ComfyUI custom
    #     node. Our pinned ComfyUI (v0.24.0-37-gad564899) has NATIVE
    #     support: supported_models.py `class ZImage(Lumina2)` and
    #     text_encoders/z_image.py `ZImageTokenizer` keyed on
    #     `qwen3_4b` (embedding_size 2560) — an exact match for the
    #     qwen_3_4b encoder below.
    #   - FLUX.2: klein-**4B** is Apache-2.0 and UNGATED (only 9B and
    #     the -base variants are gated), so no license wait. And GGUF
    #     mirrors landed — see below.
    # The ~/.cache/huggingface copy of Tongyi-MAI/Z-Image-Turbo (13GB)
    # is diffusers multi-folder format, not ComfyUI single-file, so it
    # is NOT reused here; we take Comfy-Org's repackage instead.

    # ── Z-Image-Turbo (Tongyi/Alibaba) ───────────────────────────────
    # Apache-2.0, few-step turbo, and the volume leader on the Hub by a
    # wide margin (41.2M downloads). bf16 rather than the int8_convrot /
    # nvfp4 siblings: those are NVIDIA-oriented numeric formats (nvfp4 is
    # Blackwell-class) and there is no fp8 build of the diffusion model.
    - name: z-image-turbo-bf16
      hf_repo: "Comfy-Org/z_image_turbo"
      hf_file: "split_files/diffusion_models/z_image_turbo_bf16.safetensors"
      dest: unet
      size_gb: 12.31
      license: apache-2.0
      used_by: [z-image-turbo]
      tags: [z-image, bf16, turbo, apache, sota]

    - name: z-image-qwen3-4b-encoder
      hf_repo: "Comfy-Org/z_image_turbo"
      hf_file: "split_files/text_encoders/qwen_3_4b_fp8_mixed.safetensors"
      dest: clip
      size_gb: 5.63
      license: apache-2.0
      used_by: [z-image-turbo, flux2-klein-4b]
      tags: [z-image, flux2, encoder, qwen3, shared]

    # ⚠️ dest_name is load-bearing, not cosmetic. This file is published
    # as `ae.safetensors` — the SAME basename the flux-ae entry above
    # already lands in vae/. ComfyUI scans one flat dir per type, so
    # without the rename the two clobber each other. The pipeline JSON
    # must reference `z_image_ae.safetensors`.
    - name: z-image-ae
