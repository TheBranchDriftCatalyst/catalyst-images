    # ── FLUX.2 Klein 4B (Black Forest Labs) ──────────────────────────
    # Two generations newer than the flux1-* entries above, Apache-2.0,
    # ungated, and 4.3GB at Q8_0 against 17.2GB for flux1-schnell-fp8.
    # GGUF because there is no Comfy-Org single-file repackage of klein
    # (only of flux2-dev) — loaded via UnetLoaderGGUF from the
    # city96/ComfyUI-GGUF custom node, which is already installed for
    # chroma-hd-q8.
    - name: flux2-klein-4b-q8
      hf_repo: "unsloth/FLUX.2-klein-4B-GGUF"
      hf_file: "flux-2-klein-4b-Q8_0.gguf"
      dest: unet
      size_gb: 4.30
      license: apache-2.0
      used_by: [flux2-klein-4b]
      tags: [flux2, klein, gguf, apache]

    # NO separate text encoder for klein — it REUSES the Qwen3-4B encoder
    # that z-image-qwen3-4b-encoder already pulls. This is not a guess:
    # comfy/sd.py dispatches on the DETECTED encoder weights (the
    # TEModel.QWEN3VL_* / TEModel.QWEN3_4B branch),
    # and for TEModel.QWEN3_4B it picks klein_te + KleinTokenizer when
    # clip_type is FLUX2, or the z_image tokenizer otherwise. One file,
    # two models, selected by the CLIPLoader `type`.
    #
    # Mistral-3-Small (18GB) is FLUX.2-**dev**'s encoder, not klein's —
    # an easy and expensive thing to get wrong. Confirmed against
    # upstream: black-forest-labs/FLUX.2-klein-4B ships a text_encoder/
    # of 4.97+3.08 = 8.04GB, exactly Qwen3-4B, not a 24B Mistral.

    - name: flux2-vae
      hf_repo: "Comfy-Org/flux2-dev"
      hf_file: "split_files/vae/flux2-vae.safetensors"
      dest: vae
      size_gb: 0.336
      license: other
      used_by: [flux2-klein-4b]
      tags: [flux2, vae]

    # ── Chroma1-Radiance ─────────────────────────────────────────────
