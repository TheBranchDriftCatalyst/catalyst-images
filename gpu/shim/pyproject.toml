[project]
name = "comfyui-shim"
version = "0.1.0"
description = "OpenAI-compatible /v1/images/generations shim in front of a local ComfyUI instance"
requires-python = ">=3.15.2"
dependencies = [
    "fastapi>=0.162.2",
    "uvicorn[standard]>=0.54.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.3",
    "websockets>=13",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = ["pytest>=9.2.0", "pytest-asyncio>=1.4.1.post1"]

[project.scripts]
comfyui-shim = "comfyui_shim.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/comfyui_shim"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
